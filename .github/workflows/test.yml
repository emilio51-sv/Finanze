name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # i calcoli usano date locali: li verifico sia in Italia sia in UTC
        tz: [Europe/Rome, UTC]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sintassi dei moduli
        run: for f in $(find js -name "*.js") sw.js; do node --check "$f"; done
      - name: Test
        run: npm test
